; STB Projectile Control
;
; Hold the trigger key while you loose an arrow or a spell: the camera rides it, time
; slows down, WASD (or the left stick) steers it and the mouse (or the right stick) swings
; the camera around it. The ride ends when the shot hits something or is otherwise gone.

[Keys]
; DirectInput scancode held at the moment the bow string is released.
; 0x2D = X, which vanilla leaves unbound. 0 disables the keyboard trigger.
iTriggerKeyboard = 0x2D

; Gamepad button, held the same way, 0 disables. 0x0100 = LB (sprint, which does nothing
; with a bow drawn). Others: 0x0200 = RB, 0x0040 / 0x0080 = left / right stick click,
; 0x1000 A, 0x2000 B, 0x4000 X, 0x8000 Y, 0x0001-0x0008 = D-pad up/down/left/right.
iTriggerGamepad = 0x100

; Lets go of the arrow at once: the camera comes back, the arrow flies on by itself.
; Reacts to a press, not to holding, so it can even be the same key as the trigger.
; 0x39 = Space (jumping is off during the ride anyway). 0 disables.
iCancelKeyboard = 0x39

; Gamepad button. 0x8000 = Y, jump, which is off during the ride too. (B would also open
; the menu.) 0 disables.
iCancelGamepad = 0x8000

; Hold it during the ride and the mouse flies the projectile instead of turning the
; camera. A keyboard scancode, or 0x100 + a mouse button: 0x100 = left (default),
; 0x101 = right, 0x102 = middle. Attacking is off during the ride, so the left button is
; free. 0 disables.
iMouseSteerKey = 0x100

; Slower and faster slow motion, one step per press while you fly. The new value is
; written to fWorldScale below, the same as changing it in the menu. The number pad's
; - and + work as well. 0x0C = -, 0x0D = the =/+ key. 0 disables. Keyboard only.
iSlowerKey = 0xC
iFasterKey = 0xD

[Projectiles]
; Which of your shots the trigger can take over.
bArrows = 1

; Crossbow bolts.
bBolts = 1

; Fire-and-forget spells that fly: Firebolt, Fireball, Ice Spike, Icy Spear and the
; like, from hands, staves and scrolls. Hold the trigger key as the spell leaves your hand.
; Concentration spells (flames, beams) and cone shouts have nothing to steer and are never
; taken.
bSpells = 1

; Shots that ride on their own, without holding the trigger key. Any spell, ammo, weapon
; or projectile form, separated by commas; listing it also overrides the switches above.
; Perks and costs still apply. Empty = the key is the only way in.
;   sAlwaysRide = Skyrim.esm|0x0001C789, MyMod.esp|0x000D62
; (the first one is vanilla Fireball, the second a placeholder for a form from any mod)
; Same formats as sPerk below: Plugin|FormID (always works) or an editor id (po3 Tweaks).
sAlwaysRide =

[Hint]
; Button row at the bottom of the screen while you fly the arrow:
;   [W][A][S][D] Steer   [LMB] Steer with the mouse   [-][+] Time 15%   [Space] Let go
; On a gamepad: the left stick for steering and the let-go button.
; Drawn with the keycap art your own interface already provides (SkyUI, or the set
; your UI overhaul ships).
bShow = 1

; Include the steering, mouse and time keys, not just the let-go key.
bShowSteer = 1

; Keycap size in percent, label size, and how far above the bottom edge the row sits.
fScale = 100
fFontSize = 20
fBottom = 70

[Camera]
; How far behind the arrow the camera sits, and how far above it, in game units.
; A negative distance (down to -100) puts the camera ahead of the arrow.
fDistance = 100
fHeight = 20

; Seconds the camera's heading trails the arrow's through a turn. The arrow swings its
; nose first, then the view follows -- the chase camera of a flight game. The distance
; never changes. 0 locks the camera rigidly behind the arrow; 0.25+ is lazy and cinematic.
fFollowLag = 0.15

; How far the camera rolls into a turn, in degrees, and how quickly it gets there.
; 0 turns the banking off. Negative leans the other way.
fBankAngle = 15
fBankLag = 0.2

; The mouse (or the right stick) swings the camera around the arrow without changing the
; arrow's course. The sensitivity scales the stick too.
bMouseLook = 0
fMouseSensitivity = 0.35
bInvertMouseY = 0

; How far the mouse may tilt the view away from the flight direction, in degrees.
fMousePitchLimit = 70

; Degrees per second the view drifts back behind the arrow on its own.
; 0 (default) leaves the camera wherever the mouse put it.
fRecenterSpeed = 0

; If drifting back is on, how long the mouse must rest before it starts, in seconds.
fRecenterDelay = 1

[Steering]
; Maximum turn rate in degrees per second of REAL time, so the arrow answers the keys at
; the same rate no matter how hard the slow motion is.
fTurnRate = 75

; How quickly the turn builds up when a key goes down and dies away when it comes up.
; Higher is snappier. Around 6 the keys fly smooth arcs; 0 switches the full rate on and
; off instantly, which puts a kink in the path at every press.
fTurnResponse = 8

; 0 = W points the nose up (you are looking over the arrow), 1 = flight-stick style.
bInvertY = 0

; Keep holding W and the arrow goes over the top into a full loop, the camera turning
; upside down with it. 0 stops the nose at fPitchLimit instead.
bAllowLoops = 1

; How far from level the arrow may be steered, in degrees. Only used with bAllowLoops = 0.
fPitchLimit = 85

; Degrees of turn per unit of mouse movement while iMouseSteerKey is held.
; bInvertMouseY from [Camera] applies here too.
fMouseSensitivity = 0.04

; Gravity while the arrow is being flown, as a multiple of the normal pull.
; 0 = the arrow holds whatever line you put it on, 1 = it drops as usual.
fGravityScale = 1

; Multiplies the arrow's speed when the ride starts. 1.0 leaves it alone.
fSpeedScale = 1

[Impact]
; Real seconds the camera stays on the arrow after it hits, so you see it land.
; Steering stops at the hit; the mouse still looks around. 0 cuts back instantly.
fLinger = 1

; During that pause, ease time from the slow motion back to normal: the hit itself is
; slowed, the target's reaction plays out at speed. 0 keeps the slow motion to the end.
bEaseTimeBack = 1

[Cost]
; What guiding an ARROW or BOLT costs. Stamina, Magicka, Health, or None to switch it off.
; Health never goes below 1 -- the ride will not kill you.
sActorValue = Stamina

; Paid once when the ride starts.
fStartCost = 10

; Paid per REAL second while you steer (not during the pause after the hit).
fPerSecond = 1

; 1 = no ride without the full start cost, and the ride ends (the arrow flies on) when
;     the pool runs dry.
; 0 = the ride always happens and just drains the pool to zero.
bCancelOnShortage = 1

[CostSpells]
; The same four settings for SPELLS, kept apart so a bow can cost stamina while a spell
; costs magicka.
sActorValue = Magicka
fStartCost = 10
fPerSecond = 1
bCancelOnShortage = 1

[Requirements]
; Perks the player needs before the trigger works at all, one for arrows and bolts, one
; for spells. Empty = no perk needed. Either format:
;   Plugin and form id (always works):   sPerk = MyMod.esp|0x000801
;   Editor id (needs po3 Tweaks):         sPerk = MyArrowPerk
; The form id is the one xEdit shows, load-order byte and all -- only the low bytes count.
sPerk =
sPerkSpells =

[Time]
; World and player time scale during the ride. 1.0 = no slow motion.
; This is the game's own magic slowdown, the one Slow Time uses. A Slow Time already
; running when the ride starts is never made weaker, and is handed back afterwards.
fWorldScale = 0.25
fPlayerScale = 0.25

[Range]
; Game units from where the shot was fired; past it the camera hands back and the shot
; flies on by itself. 0 = no cap. (A cell is 4096 units.) A shot that leaves the loaded
; part of the world ends the ride anyway: past that edge there is nothing to hit.
fMaxDistance = 0

; How far the projectile may fly before the game removes it, as a multiple of its own
; range, while you steer it. Spells in particular run out after a while. 1.0 = as the
; game has it, 0 = it never runs out. Once you let go it is back to its normal range.
fLifeScale = 5

[General]
; Safety backstop in real seconds. The ride is torn down even if the arrow never reported
; its death -- this is not meant as a gameplay timer, so keep it generous.
fMaxDurationRealSeconds = 60

bDebugLog = 0
